# Builds the keeper image on every change under keeper/ and publishes it to GitHub Container Registry as
# ghcr.io/voicebillz/backx-keeper:latest (+ the commit sha). Servers pull this image (docs/KEEPERS.md).
# No secrets are baked in: keys come from each server's own settings at run time.
name: keeper-image
on:
  push:
    branches: [main]
    paths: ['keeper/**', '.github/workflows/keeper-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: keeper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/voicebillz/backx-keeper:latest
            ghcr.io/voicebillz/backx-keeper:${{ github.sha }}
