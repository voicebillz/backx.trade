<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GazzPad v4</title>
<style>
  @font-face { font-family: "Geist"; font-weight: 500; font-display: block; src: url(fonts/Geist-500.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 600; font-display: block; src: url(fonts/Geist-600.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 700; font-display: block; src: url(fonts/Geist-700.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 800; font-display: block; src: url(fonts/Geist-800.woff2) format("woff2"); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  * { box-sizing: border-box; }
  #stage {
    position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(120% 95% at 50% 38%, #ffffff 0%, #f7f7f9 58%, #eeeef2 100%);

  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .abs { position: absolute; left: 0; top: 0; }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
  .line { position: absolute; overflow: hidden; white-space: nowrap; padding: 0.06em 0 0.16em; }
  .line > span { display: inline-block; will-change: transform; }
  .disp { font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  .sub { font-weight: 500; letter-spacing: -0.015em; color: #6e6e73; line-height: 1.1; }

  .circ { position: absolute; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: 0 18px 40px -18px rgba(20,20,40,.35), 0 0 0 1px rgba(10,10,20,.06); }
  .circ img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tick { position: absolute; font-weight: 600; font-size: 19px; color: #6e6e73; letter-spacing: -0.01em; text-align: center; width: 120px; }
  .chip { position: absolute; height: 92px; border-radius: 46px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 44px; letter-spacing: -0.03em; color: #fff; background: #1a1b22; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); font-variant-numeric: tabular-nums; }
  .pool { position: absolute; width: 340px; height: 120px; border-radius: 30px; background: #16171e; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12); display: flex; align-items: center; gap: 20px; padding: 0 26px; color: #fff; }
  .pool img { width: 64px; height: 64px; border-radius: 50%; }
  .pool b { display: block; font-size: 30px; letter-spacing: -0.02em; font-weight: 700; }
  .pool i { display: block; font-style: normal; font-size: 21px; color: #9a9aa6; font-weight: 500; margin-top: 4px; }
  .badge { display: inline-block; font-size: 18px; font-weight: 700; padding: 5px 12px; border-radius: 99px; letter-spacing: 0; }
  .card { position: absolute; width: 252px; height: 340px; border-radius: 34px; background: #13161e; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.09), 0 30px 60px -30px rgba(0,0,0,.6); overflow: hidden; }
  .card img { position: absolute; left: 26px; top: 16px; width: 200px; height: 200px; }
  .card b { position: absolute; left: 24px; top: 226px; font-size: 32px; letter-spacing: -0.03em; color: #fff; font-weight: 700; }
  .card i { position: absolute; left: 24px; top: 272px; right: 18px; font-style: normal; font-size: 20px; line-height: 1.2; color: #9a9aa6; font-weight: 500; }
  .card u { position: absolute; right: 20px; top: 20px; text-decoration: none; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wl { position: absolute; width: 92px; height: 92px; border-radius: 50%; overflow: hidden; box-shadow: 0 10px 24px -14px rgba(20,20,40,.4), 0 0 0 1px rgba(10,10,20,.06); background: #fff; }
  .wl img, .fly img, .slot img, .drop img { width: 100%; height: 100%; display: block; }
  .fly, .drop { position: absolute; border-radius: 50%; overflow: hidden; background: #fff; }
  .slot { position: absolute; display: flex; align-items: center; gap: 18px; color: #fff; }
  .slot .o { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.14); }
  .slot b { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .slot i { font-style: normal; font-size: 22px; color: #9a9aa6; font-weight: 500; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .av { position: absolute; width: 150px; height: 150px; border-radius: 50%; overflow: hidden; box-shadow: 0 18px 40px -20px rgba(20,20,40,.4); }
  .av svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam"></div>

<script>
// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, t0, d) => clamp((t - t0) / d);
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
  const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
    return sy(clamp(t)); };
}
const EO = bez(0.16, 1, 0.3, 1);
const EIO = bez(0.76, 0, 0.24, 1);
const CAMC = bez(0.65, 0, 0.35, 1);
const EI = bez(0.7, 0, 0.84, 0);
function spring(p, zeta = 0.72) {
  if (p <= 0) return 0; if (p >= 1) return 1;
  const w = 5.3 / zeta, wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * p) * (Math.cos(wd * p) + (zeta * w / wd) * Math.sin(wd * p));
}
const sp = (t, t0, d, z) => spring(prog(t, t0, d), z);
const el = (tag, parent, style = {}, cls = "") => { const e = document.createElement(tag); if (cls) e.className = cls; Object.assign(e.style, style); parent.appendChild(e); return e; };
const px = (v) => v.toFixed(3) + "px";
const vis = (e, on) => { e.style.display = on ? (e._d || "") : "none"; };
function setRect(e, x, y, w, h, r) { e.style.left = px(x); e.style.top = px(y); e.style.width = px(w); e.style.height = px(h); if (r != null) e.style.borderRadius = px(r); }
const rl = (A, B, p) => ({ x: lerp(A.x, B.x, p), y: lerp(A.y, B.y, p), w: lerp(A.w, B.w, p), h: lerp(A.h, B.h, p), r: lerp(A.r, B.r, p) });
const circ = (cx, cy, d) => ({ x: cx - d / 2, y: cy - d / 2, w: d, h: d, r: d / 2 });
function textLine(parent, o) {
  const l = el("div", parent, { left: px(o.x - o.w / 2), top: px(o.y), fontSize: px(o.size), color: o.color || "", width: px(o.w), textAlign: "center" }, "line " + (o.cls || "disp"));
  l._words = o.words.map((wd, k) => { const s = el("span", l, { color: (o.colors && o.colors[k]) || "" }); s.textContent = wd + (k < o.words.length - 1 ? " " : ""); return s; });
  return l;
}
function lineAt(l, t, tin, tout, stagger = 0.07, dIn = 0.7, dOut = 0.4) {
  let on = false;
  l._words.forEach((s, k) => {
    const pi = EO(prog(t, tin + k * stagger, dIn));
    const po = tout == null ? 0 : EI(prog(t, tout + k * stagger * 0.4, dOut));
    s.style.transform = `translate3d(0,${((1 - pi) * 115 - po * 115).toFixed(3)}%,0)`;
    if (pi > 0 && po < 1) on = true;
  });
  vis(l, on);
}
const tf = (e, x, y, s = 1) => { e.style.transform = `translate(${px(x)},${px(y)}) scale(${s.toFixed(4)})`; };
const pushZ = (e, t, t0, t1, z1) => { const z = lerp(1, z1, CAMC(prog(t, t0, t1 - t0))); e.style.transform = `scale(${z.toFixed(5)})`; };

// ---------------------------------------------------------------- timeline
// voiceover (take 1) starts at VO = 1.0 s; every scene is timed to its words
const DUR = 43.0;
const CUES = [];
function cue(t, f, g = 1) { CUES.push({ t: +t.toFixed(3), f, g }); }
const MODE_T = [19.09, 20.06, 20.96, 21.91, 23.44, 24.35];
const MODES = [
  { k: "holders", n: "Holders", c: "Airdrop to holders", col: "#14b8a6", pct: 30 },
  { k: "creator", n: "Creator", c: "Paid to the dev", col: "#17b95c", pct: 20 },
  { k: "liquidity", n: "Liquidity", c: "Deepens the pool", col: "#3b82f6", pct: 15 },
  { k: "buyback", n: "Buyback", c: "Buys and burns the coin", col: "#d9a441", pct: 15 },
  { k: "invest", n: "Funds", c: "Fund shares to holders", col: "#6366f1", pct: 10 },
  { k: "lottery", n: "Lottery", c: "Random holder drops", col: "#ec4899", pct: 10 },
];
// live GazzPad pairings (api.gazz.fun/api/gazzpad, 2026-10-30)
const RING_C = { sym: "ETH", img: "img/eth.svg" };
const INNER = [["USDG", "img/USDG.png"], ["GAZZ", "img/gazz-logo-1024.png"], ["PONS", "img/pons-256.png"], ["Index", "img/Index.png"], ["NVDA", "img/logos/NVDA.png"], ["AAPL", "img/logos/AAPL.png"]];
const OUTER = ["TSLA", "MSFT", "SPY", "QQQ", "AMZN", "GOOGL", "META", "COIN"].map((s) => [s, `img/logos/${s}.png`]);
// basket wall (7 cols); picks fly into the basket in order
const WALL_COLS = 7, WALL_ROWS = 9, CELL = 124, WX = 900, WY = 230, WW = 868, WH = 640;
const PICKS = [["AAPL", 1, 1], ["NVDA", 3, 1], ["TSLA", 5, 2], ["MSFT", 0, 2], ["AMZN", 2, 3], ["GOOGL", 6, 1], ["META", 4, 3], ["SPY", 1, 4], ["COIN", 5, 4], ["GLD", 3, 5]];
const PICK_T0 = 27.55, PICK_DT = 0.17, FLY_D = 0.62;
const scrollAt = (t) => lerp(0, 230, prog(t, 25.2, 7.0));
const AV_T0 = 29.55;
const AVS = [[1060, 330], [1300, 330], [1540, 330], [1060, 590], [1300, 590], [1540, 590]];
const AV_COL = [["#b8f43a", "#14b8a6"], ["#38e8d0", "#6366f1"], ["#8b5cf6", "#ec4899"], ["#f59e0b", "#ef4444"], ["#3b82f6", "#38e8d0"], ["#17b95c", "#b8f43a"]];
const DROPS = Array.from({ length: 18 }, (_, i) => ({ s: i % 10, a: i % 6, t: 29.95 + i * 0.075 }));

// sound cues, placed with the motion they belong to
cue(0.25, "pop-soft", 0.7); cue(0.95, "whoosh-soft", 0.3);
cue(4.4, "whoosh-soft", 0.35); cue(4.85, "whoosh-fast", 0.3);
[0, 1, 2, 3].forEach((i) => cue(6.6 + i * 0.13, "pop-soft", 0.35 + i * 0.05)); cue(7.75, "click-ui", 0.6);
[8.6, 8.85, 9.1].forEach((x, i) => cue(x, "pop-soft", 0.4 + i * 0.05)); cue(11.55, "notify-pop", 0.45);
cue(12.95, "whoosh-soft", 0.35); cue(13.55, "pop-soft", 0.45);
[0, 1, 2, 3, 4].forEach((i) => cue(13.75 + i * 0.22, "pop-soft", 0.2 + i * 0.03));
cue(16.0, "whoosh-soft", 0.3); cue(16.42, "click-ui-2", 0.55); cue(16.95, "whoosh-fast", 0.3);
MODE_T.forEach((x, i) => cue(x - 0.05, "pop-soft", 0.45 + (i % 2) * 0.08));
cue(24.95, "whoosh-soft", 0.35);
PICKS.forEach((_, i) => cue(PICK_T0 + i * PICK_DT, i % 2 ? "click-ui-2" : "click-ui", 0.32));
cue(29.3, "whoosh-soft", 0.3); [0, 2, 4].forEach((i) => cue(AV_T0 + i * 0.06, "pop-soft", 0.3));
cue(31.45, "whoosh-soft", 0.35); cue(34.95, "success-chime", 0.35);
cue(36.45, "whoosh-soft", 0.35); cue(36.9, "impact-soft", 0.7);
window.CUES = CUES; window.DUR = DUR;

// ---------------------------------------------------------------- build
const N = {};
function build() {

  N.haze = el("div", cam, { position: "absolute", left: "260px", top: "120px", width: "1400px", height: "900px", borderRadius: "50%", background: "radial-gradient(closest-side, rgba(99,102,241,.13), rgba(56,232,208,.06) 55%, rgba(255,255,255,0) 100%)" });

  // ---- S1: Uniswap v4 hook

  N.s1a._words[3].classList.add("grad");

  // ---- dark plate: morphs between every scene
  N.plate = el("div", cam, { position: "absolute", background: "#0c0d12", overflow: "hidden" });

  // ---- S2: transfer tax
  N.s2 = el("div", cam, {}, "scene dk");
  N.s2a = textLine(N.s2, { x: 960, y: 300, w: 1700, size: 96, color: "#fff", words: ["Then", "we", "doubled", "down."] });
  N.s2b = textLine(N.s2, { x: 960, y: 470, w: 1200, size: 34, cls: "sub dk", words: ["Transfer", "tax,", "locked", "in", "the", "token"] });
  N.chips = [1, 2, 3, 5].map((v, i) => { const c = el("div", N.s2, { left: px(960 - 2 * 210 + i * 210 + 10), top: "560px", width: "190px" }, "chip"); c.textContent = v + "%"; c._d = "flex"; return c; });

  N.s2c = textLine(N.s2, { x: 960, y: 170, w: 1700, size: 72, color: "#fff", words: ["Protected", "across", "every", "pool."] });
  N.s2d = textLine(N.s2, { x: 960, y: 870, w: 1500, size: 40, cls: "sub dk", words: ["Even", "without", "our", "native", "hook."] });
  N.coin = el("div", N.s2, { position: "absolute", left: "880px", top: "330px", width: "160px", height: "160px", borderRadius: "50%", background: "linear-gradient(135deg,#b8f43a,#38e8d0 50%,#8b5cf6)", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: "800", fontSize: "34px", letterSpacing: "-0.03em", color: "#0a0b10" });
  N.coin.textContent = "$COIN"; N.coin._d = "flex";
  N.svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  Object.assign(N.svg.style, { position: "absolute", left: "0", top: "0", width: "1920px", height: "1080px" });
  N.svg.setAttribute("viewBox", "0 0 1920 1080"); N.s2.insertBefore(N.svg, N.s2.firstChild);
  const POOLS = [
    { x: 330, img: "img/uniswap.png", n: "Uniswap v4", b: "Hook fee", bc: "#ff007a" },
    { x: 790, img: "img/pancakeswap.png", n: "PancakeSwap", b: "Hook fee", bc: "#1fc7d4" },
    { x: 1250, img: null, n: "Any new pool", b: "Transfer tax", bc: "#b8f43a" },
  ];
  N.pools = POOLS.map((p, i) => {
    const d = el("div", N.s2, { left: px(p.x), top: "640px" }, "pool"); d._d = "flex";
    if (p.img) { const im = el("img", d); im.src = p.img; }
    else { const g = el("div", d, { width: "64px", height: "64px", borderRadius: "50%", background: "#24252e", display: "flex", alignItems: "center", justifyContent: "center", color: "#b8f43a", fontSize: "40px", fontWeight: "700" }); g.textContent = "+"; }
    const tx = el("div", d); tx.innerHTML = `<b>${p.n}</b><i><span class="badge" style="background:${p.bc}22;color:${p.bc}">${p.b}</span></i>`;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const x2 = p.x + 170, y2 = 640;
    path.setAttribute("d", `M960 490 C 960 570, ${x2} 560, ${x2} ${y2}`);
    path.setAttribute("fill", "none"); path.setAttribute("stroke", i === 2 ? "#b8f43a" : "rgba(255,255,255,.35)"); path.setAttribute("stroke-width", "3");
    N.svg.appendChild(path); d._path = path; d._len = path.getTotalLength();

  });

  // ---- S3: pairings

  N.s3a = textLine(N.s3, { x: 960, y: 92, w: 1800, size: 80, words: ["Pair", "to", "stocks,", "natives", "and", "memes."], colors: ["", "", "#2563eb", "#6366f1", "", "#17b95c"] });
  N.ethC = el("div", cam, {}, "circ"); el("img", N.ethC).src = RING_C.img;
  N.ethT = el("div", cam, {}, "tick"); N.ethT.textContent = "ETH";
  const mk = (arr, d, rx, ry, a0) => arr.map(([s, src], i) => {
    const a = a0 + (i / arr.length) * Math.PI * 2;
    const c = el("div", N.s3, {}, "circ"); el("img", c).src = src;

  N.inner = mk(INNER, 116, 270, 190, -Math.PI / 2);
  N.outer = mk(OUTER, 100, 590, 300, -Math.PI / 2 + Math.PI / 8);

  // creator fee label (rides the plate while it is a pill)
  N.fee = el("div", cam, { position: "absolute", left: "0", top: "0", display: "flex", alignItems: "center", gap: "22px", whiteSpace: "nowrap", color: "#fff", fontWeight: "700", fontSize: "50px", letterSpacing: "-0.035em", transformOrigin: "0 0" });
  N.fee.innerHTML = 'Creator fee <span class="badge" style="font-size:28px;padding:8px 18px;background:#b8f43a;color:#0a0b10">up to 2%</span>';

  // ---- S4: fee modes

  N.cards = MODES.map((m, i) => {

  // ---- S5: reward basket
  N.s5 = el("div", cam, {}, "scene");
  N.s5a = textLine(N.s5, { x: 960, y: 72, w: 1800, size: 72, words: ["Pick", "your", "own", "reward", "basket."] });
  N.s5b = textLine(N.s5, { x: 1330, y: 170, w: 900, size: 36, cls: "sub", words: ["Choose", "from", "200+", "assets."], colors: ["", "", "#0b0b0f", ""] });
  N.s5c = textLine(N.s5, { x: 1330, y: 170, w: 900, size: 36, cls: "sub", words: ["Airdropped", "to", "your", "holders."] });
  N.wallBox = el("div", N.s5, { position: "absolute", left: px(WX), top: px(WY), width: px(WW), height: px(WH), overflow: "hidden", WebkitMaskImage: "linear-gradient(180deg, transparent 0, #000 70px, #000 570px, transparent 640px)", maskImage: "linear-gradient(180deg, transparent 0, #000 70px, #000 570px, transparent 640px)" });

  { const a = prog(t, 16.35, 0.3), b = EIO(prog(t, 16.95, 0.6)), o = EI(prog(t, 24.85, 0.35));
    vis(N.fee, t > 16.35 && o < 1);

    document.getElementById("vring").setAttribute("stroke-dasharray", `${(2 * Math.PI * 160 * pc / 100).toFixed(2)} 2000`); }

  // ===== S7 (36.6 - 43)
  vis(N.s7, t > 36.7);
  { const m = prog(t, 36.95, 0.25);
    vis(N.mark, t > 36.95); setRect(N.mark, MARK.x, MARK.y, 170, 170);
    N.mark.style.opacity = m.toFixed(3); }
  lineAt(N.s7a, t, 36.85, null, 0.1);
  lineAt(N.s7b, t, 37.85, null, 0.08);
  { const p = EO(prog(t, 38.05, 0.6)); vis(N.rh, p > 0);
    N.rh.style.left = px(N.rh._x); N.rh.style.opacity = p.toFixed(3); N.rh.style.transform = `translateY(${px((1 - p) * 20)})`; }
  lineAt(N.s7c, t, 39.4, null, 0.1);
  const zEnd = lerp(1, 1.035, CAMC(prog(t, 37.2, 5.8)));
  document.getElementById("cam").style.transform = t > 36.95 ? `translate(${px(960 * (1 - zEnd))},${px(540 * (1 - zEnd))}) scale(${zEnd.toFixed(5)})` : "";
  pushZ(N.s4, t, 17.5, 24.8, 1.025);
}

// ---------------------------------------------------------------- boot
async function boot() {
  await Promise.all(["800 100px Geist", "700 100px Geist", "600 40px Geist", "500 40px Geist"].map((f) => document.fonts.load(f)));
  await document.fonts.ready;
  build();
  await Promise.all([...document.images].map((im) => im.decode().catch(() => { throw new Error("img " + im.src); })));
  seek(0);
  window.seek = seek;
  const q = new URLSearchParams(location.search).get("t"); if (q) seek(+q);
  window.READY = true;
}
boot().catch((e) => { window.BOOT_ERR = String((e && e.stack) || e); });
</script>
