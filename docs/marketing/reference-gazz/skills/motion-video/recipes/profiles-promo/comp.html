    const stripOn = EO(prog(t, W_ONE + 0.18, 0.3));
    put(N.strip, 960, 640, 1, "", 0, stripOn);
    N.stats.forEach((d, i) => {
      const a = sp(t, T3 + 0.12 + i * 0.12, 0.9, 0.74);
      const fx = 960 + (i - 1.5) * 470, fy = 640 + [-26, 22, -14, 26][i], fr = [-3, 2, -2, 3][i];
      const jx = 960 + (i - 1.5) * 400;
      const x = lerp(fx, jx, sn), y = lerp(fy, 640, sn), r = lerp(fr, 0, sn);
      put(d, x, y + (1 - a) * 240, lerp(0.85, 1, a) * lerp(0.92, 1, sn), `rotate(${(r * a).toFixed(2)}deg)`, (1 - a) * 12, clamp(a * 3));
      d.style.background = `rgba(255,255,255,${(1 - stripOn).toFixed(3)})`;
      d.style.borderColor = `rgba(15,17,21,${(0.08 * (1 - stripOn)).toFixed(3)})`;
      d.style.boxShadow = stripOn < 0.99 ? `0 2px 4px rgba(15,17,21,${(0.04 * (1 - stripOn)).toFixed(3)}), 0 30px 70px rgba(15,17,21,${(0.10 * (1 - stripOn)).toFixed(3)})` : "none";
      d._div.style.opacity = i ? stripOn.toFixed(3) : "0";
      const c = EO(prog(t, T3 + 0.25 + i * 0.12, 1.1));
      d._val.textContent = d._f(d._v * c);
    });
    phraseAt(N.p3a, t, 10.98, W_ONE - 0.16, 0.1);
    phraseAt(N.p3b, t, W_ONE, null, 0.12);
  }

  // ===== S4 biggest wins: tiles glide in, the camera leans into the biggest one
  if (focus(N.s4, t, T4, T5 - 0.06, 0.35, 0.3)) {
    const a = sp(t, T4 + 0.02, 0.9, 0.78);
    const z = EIO(prog(t, 15.85, 0.7));
    // lean toward tile 0 (stage x ~ 960-870+46+128 = 264)
    const zx = lerp(960, 640 + (960 - 264) * 1.32, z), zy = lerp(650, 610, z);
    put(N.winCard, zx, zy + (1 - a) * 260, lerp(0.9, 1, a) * lerp(1, 1.32, z), "", (1 - a) * 8, clamp(a * 3));
    N.tiles.forEach((d, i) => {
      const b = sp(t, T4 + 0.2 + i * 0.09, 0.85, 0.74);
      d.style.transform = `translateX(${((1 - b) * 260).toFixed(2)}px) scale(${lerp(0.86, 1, b).toFixed(4)})`;
      d.style.opacity = clamp(b * 3).toFixed(3);
      const soft = i ? z : 0;
      d.style.filter = soft > 0.02 ? `blur(${(soft * 3.2).toFixed(2)}px)` : "";
      d.style.opacity = (clamp(b * 3) * (1 - 0.35 * soft)).toFixed(3);
      const c = EO(prog(t, T4 + 0.4 + i * 0.09, 1.0));
      d._m.textContent = money(d._usd * c);
    });
    const hr = EO(prog(t, 15.95, 0.35));
    N.heroRing.style.opacity = hr.toFixed(3); N.heroRing.style.transform = `scale(${lerp(1.08, 1, hr).toFixed(4)})`; show(N.heroRing, hr > 0);
    phraseAt(N.p4a, t, 14.48, W_BIG - 0.16, 0.1);
    phraseAt(N.p4b, t, W_BIG, null, 0.12);
  }

  // ===== S5 theses + the reader opening
  if (focus(N.s5, t, T5, T6 - 0.06, 0.35, 0.3)) {
    const a = sp(t, T5 + 0.02, 0.9, 0.78);
    put(N.thCard, 960, 650 + (1 - a) * 260, lerp(0.9, 1, a), `perspective(2400px) rotateX(${((1 - a) * 14).toFixed(2)}deg)`, (1 - a) * 8, clamp(a * 3));
    N.ths.forEach((d, i) => {
      const b = sp(t, T5 + 0.15 + i * 0.1, 0.85, 0.76);
      const press = i === 0 ? Math.sin(Math.PI * prog(t, 19.1, 0.2)) * 0.03 : 0;
      d.style.transform = `translateY(${((1 - b) * 120).toFixed(2)}px) scale(${(lerp(0.9, 1, b) - press).toFixed(4)})`;
      d.style.opacity = clamp(b * 3).toFixed(3);
      d.style.borderColor = i === 0 && t > 19.1 ? "rgba(77,124,15,.55)" : C.line2;
    });
    tapAt(N.tap5, t, 19.1);
    const r = sp(t, 19.3, 0.85, 0.8);
    N.scrim.style.opacity = (0.9 * EO(prog(t, 19.25, 0.35))).toFixed(3); show(N.scrim, t > 19.25);
    put(N.reader, 960, 560 + (1 - r) * 520, lerp(0.92, 1, r), "", (1 - r) * 6, clamp(r * 3)); show(N.reader, t > 19.3);
    phraseAt(N.p5a, t, 17.98, W_READ - 0.16, 0.12);
    phraseAt(N.p5b, t, W_READ, null, 0.1);
    N.p5a.style.zIndex = N.p5b.style.zIndex = "70";
  }

  // ===== S6 end card: "Gazz dot fun. Not just social trading, but fun!"
  if (focus(N.s6, t, T6, null, 0.4)) {
    const m = sp(t, W_GAZZ - 0.12, 0.9, 0.68);
    N.logo.style.transform = `translateY(${((1 - m) * 110).toFixed(2)}px) scale(${lerp(0.6, 1, m).toFixed(4)})`;
    N.logo.style.opacity = clamp(m * 3).toFixed(3);
    N.logo.style.filter = m < 0.98 ? `blur(${((1 - m) * 10).toFixed(2)}px)` : "";
    phraseAt(N.word, t, W_GAZZ, null);
    phraseAt(N.tag1, t, W_NOT - 0.04, null, 0.1);
    phraseAt(N.tag2, t, W_FUN - 0.3, null, 0.24);
    // lime highlighter sweeps behind "fun!" as it is said, then a small bounce
    const fw = N.tag2._w[1];
    const h = EO(prog(t, W_FUN - 0.04, 0.32)), bo = sp(t, W_FUN - 0.04, 0.8, 0.45);
    N.hl.style.left = px(N.tag2.offsetLeft + fw.offsetLeft - 22); N.hl.style.top = px(680 + fw.offsetTop + fw.offsetHeight * 0.16);
    N.hl.style.width = px(fw.offsetWidth + 44); N.hl.style.height = px(fw.offsetHeight * 0.78);
    N.hl.style.transform = `scaleX(${h.toFixed(4)})`; show(N.hl, h > 0);
    N.tag2.style.zIndex = "50";
    fw.style.transform += ` scale(${lerp(0.9, 1, bo).toFixed(4)})`;
  }
}

// ---------------------------------------------------------------- boot
async function boot() {
  await Promise.all(["800 100px Geist", "700 100px Geist", "600 40px Geist", "500 40px Geist"].map((f) => document.fonts.load(f)));
  await document.fonts.ready;
  build();
  await Promise.all([...document.images].map((im) => im.decode().catch(() => { throw new Error("img " + im.src); })));
  const q = new URLSearchParams(location.search).get("t");
  seek(q ? +q : 0);
  window.seek = seek; window.READY = true;
}
boot().catch((e) => { window.BOOT_ERR = String((e && e.stack) || e); });
</script>
